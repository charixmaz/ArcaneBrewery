name: ArcaneBrewery
version: 1.0
main: me.arcanebrewery.arcaneBrewery.ArcaneBrewery
api-version: '26.1'
author: ArcaneBreweryTeam
description: Fantasy Brewing & Alchemy for Paper 26.1.2.
softdepend: [ArcaneEconomy]

commands:
  brew:
    description: ArcaneBrewery player commands.
    usage: /brew help
    aliases: [arcanebrewery]
    permission: arcanebrewery.use
  brewmarket:
    description: ArcaneBrewery market recovery diagnostics.
    usage: /brewmarket help
    permission: arcanebrewery.admin.market

permissions:
  arcanebrewery.admin.bypass:
    description: Access machines without changing ownership; exclusive sessions and safety locks still apply.
    default: op
  arcanebrewery.use:
    description: Allows access to ArcaneBrewery player commands.
    default: true

  arcanebrewery.admin.market:
    description: Allows read-only inspection of market recovery records.
    default: op

  arcanebrewery.market.sell:
    description: Allows a player to sell canonical drinks when the server market is enabled.
    default: true
