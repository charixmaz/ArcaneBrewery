name: ArcaneAlchemy
version: 1.0
main: me.arcanebrewery.arcaneBrewery.ArcaneBrewery
api-version: '26.1'
author: ArcaneAlchemyTeam
description: Fantasy Brewing & Alchemy for Paper 26.1.2.

commands:
  arcanealchemy:
    description: ArcaneAlchemy player commands.
    usage: /al help
    aliases: [al, brew, arcanebrewery]
    permission: arcanebrewery.use
  brewmarket:
    description: ArcaneAlchemy historical market recovery diagnostics (read-only).
    usage: /brewmarket help
    permission: arcanebrewery.admin.market

permissions:
  arcanebrewery.rename.colors:
    description: Allows color-only codes (&0–&f) in the one permanent elixir rename.
    default: false
  arcanebrewery.admin.bypass:
    description: Access machines without changing ownership; exclusive sessions and safety locks still apply.
    default: op
  arcanebrewery.use:
    description: Allows access to ArcaneAlchemy player commands.
    default: true

  arcanebrewery.admin.market:
    description: Allows read-only inspection of market recovery records.
    default: op
