name: ArcaneEconomy
version: '${project.version}'
main: me.arcanebrewery.arcaneeconomy.ArcaneEconomyPlugin
api-version: '1.21'
authors: [charixmaz]
description: Modern Paper-first economy service for ArcaneBrewery and other plugins.
commands:
  money:
    description: Show an account balance.
    usage: /money [player]
    permission: arcaneeconomy.balance
  pay:
    description: Transfer funds to another player.
    usage: /pay <player> <amount>
    permission: arcaneeconomy.pay
  eco:
    description: Administrative economy commands.
    usage: /eco <give|take|set> <player> <amount>
    permission: arcaneeconomy.admin
permissions:
  arcaneeconomy.balance:
    default: true
  arcaneeconomy.balance.others:
    default: op
  arcaneeconomy.pay:
    default: true
  arcaneeconomy.admin:
    default: op
