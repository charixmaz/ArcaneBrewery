name: Build

on:
  push:
    branches:
      - master
      - arcane-v1-refactor
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build ArcaneBrewery
        run: mvn --batch-mode clean verify

      - name: Build ArcaneEconomy
        run: mvn --batch-mode -f arcane-economy/pom.xml clean verify
