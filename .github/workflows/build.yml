name: Build

on:
  push:
    branches:
      - master
      - arcane-v1-refactor
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify and install standalone economy API
        run: mvn --batch-mode -f arcane-economy-api/pom.xml clean install

      - name: Build ArcaneBrewery
        run: mvn --batch-mode clean verify

      - name: Verify optional economy API packaging
        run: python3 scripts/verify-economy-packaging.py

      - name: Boot ArcaneBrewery on Paper without ArcaneEconomy
        if: vars.PAPER_EULA_ACCEPTED == 'true'
        env:
          PAPER_EULA_ACCEPTED: ${{ vars.PAPER_EULA_ACCEPTED }}
        run: bash scripts/paper-smoke-test.sh

      - name: Report smoke test acceptance blocker
        if: vars.PAPER_EULA_ACCEPTED != 'true'
        run: echo '::notice::Paper smoke test not run. No owner-provided PAPER_EULA_ACCEPTED repository variable.'

      - name: Upload ArcaneBrewery JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneBrewery
          path: target/ArcaneBrewery-*.jar
          if-no-files-found: error

      - name: Upload economy API artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneEconomy-API
          path: arcane-economy-api/target/arcane-economy-api-*.jar
          if-no-files-found: error
