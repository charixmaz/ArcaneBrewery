name: Build

on:
  push:
    branches:
      - master
      - arcane-v1-refactor
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build ArcaneBrewery
        run: mvn --batch-mode clean verify

      - name: Build ArcaneEconomy
        run: mvn --batch-mode -f arcane-economy/pom.xml clean verify

      - name: Upload ArcaneBrewery JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneBrewery
          path: target/ArcaneBrewery-*.jar
          if-no-files-found: error

      - name: Upload ArcaneEconomy JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneEconomy
          path: arcane-economy/target/ArcaneEconomy-*.jar
          if-no-files-found: error
